<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Game Perkalian SD</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f2f7ff;
}

.card{
    border-radius:20px;
}

#question{
    font-size:48px;
    font-weight:bold;
}

#score{
    font-size:20px;
}

#result{
    font-size:20px;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">
🎯 Game Perkalian
</h2>

<div id="setup">

<div class="mb-3">

<label>Latihan Perkalian</label>

<select class="form-select" id="multiplier">

<option value="2">Perkalian 2</option>
<option value="3">Perkalian 3</option>
<option value="4">Perkalian 4</option>
<option value="5">Perkalian 5</option>
<option value="6">Perkalian 6</option>
<option value="7">Perkalian 7</option>
<option value="8">Perkalian 8</option>
<option value="9">Perkalian 9</option>
<option value="10">Perkalian 10</option>
<option value="11">Perkalian 11</option>
<option value="12">Perkalian 12</option>

</select>

</div>

<div class="mb-3">

<label>Jumlah Soal</label>

<select class="form-select" id="totalQuestion">

<option>10</option>
<option>20</option>
<option>30</option>

</select>

</div>

<button class="btn btn-primary w-100" onclick="startGame()">
Mulai Bermain
</button>

</div>

<div id="game" style="display:none">

<div class="d-flex justify-content-between mb-3">

<div id="score">
Benar : 0
</div>

<div id="timer">
0 detik
</div>

</div>

<div class="progress mb-3">

<div class="progress-bar"
id="progress"
style="width:0%">
</div>

</div>

<div class="text-center">

<div id="question"></div>

<input
type="number"
class="form-control form-control-lg mt-4"
id="answer"
placeholder="Jawaban">

<button
class="btn btn-success btn-lg mt-3"
onclick="checkAnswer()">

Jawab

</button>

<div id="result" class="mt-3"></div>

</div>

</div>

<div id="finish" style="display:none">

<h2 class="text-center text-success">
🎉 Selesai
</h2>

<hr>

<h4 id="finalScore"></h4>

<h5 id="finalTime"></h5>

<button
class="btn btn-primary w-100 mt-3"
onclick="location.reload()">

Main Lagi

</button>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

let multiplier;
let currentQuestion=1;
let totalQuestion=10;
let number;
let answer;
let correct=0;
let wrong=0;
let second=0;

let interval;

function startGame(){

multiplier=parseInt(document.getElementById("multiplier").value);

totalQuestion=parseInt(document.getElementById("totalQuestion").value);

document.getElementById("setup").style.display="none";

document.getElementById("game").style.display="block";

interval=setInterval(function(){

second++;

document.getElementById("timer").innerHTML=
second+" detik";

},1000);

newQuestion();

}

function newQuestion(){

number=Math.floor(Math.random()*10)+1;

document.getElementById("question").innerHTML=

multiplier+" × "+number+" = ?";

document.getElementById("answer").value="";

document.getElementById("answer").focus();

answer=multiplier*number;

let persen=((currentQuestion-1)/totalQuestion)*100;

document.getElementById("progress").style.width=persen+"%";

}

function checkAnswer(){

let user=parseInt(document.getElementById("answer").value);

if(user===answer){

correct++;

document.getElementById("result").innerHTML=
"✅ Benar";

document.getElementById("result").className="text-success";

}else{

wrong++;

document.getElementById("result").innerHTML=
"❌ Salah. Jawaban = "+answer;

document.getElementById("result").className="text-danger";

}

document.getElementById("score").innerHTML=
"Benar : "+correct+" | Salah : "+wrong;

currentQuestion++;

if(currentQuestion>totalQuestion){

finishGame();

}else{

setTimeout(function(){

document.getElementById("result").innerHTML="";

newQuestion();

},700);

}

}

function finishGame(){

clearInterval(interval);

document.getElementById("game").style.display="none";

document.getElementById("finish").style.display="block";

let nilai=Math.round((correct/totalQuestion)*100);

document.getElementById("finalScore").innerHTML=

"Nilai : "+nilai+
"<br><br>Benar : "+correct+
"<br>Salah : "+wrong;

document.getElementById("finalTime").innerHTML=

"Waktu : "+second+" detik";

}

document.addEventListener("keydown",function(e){

if(e.key==="Enter"){

if(document.getElementById("game").style.display!="none")

checkAnswer();

}

});

</script>

</body>
</html>
