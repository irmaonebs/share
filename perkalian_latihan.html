<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Hero SD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#7dd3fc,#dbeafe);min-height:100vh}
.card{border-radius:20px}.big{font-size:3rem;font-weight:bold}.ok{color:green}.bad{color:red}
#game{display:none} .heart{font-size:1.4rem}.shake{animation:s .2s 2}@keyframes s{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body><div class="container py-4">
<div class="card p-4 shadow">
<h2 class="text-center">🎮 Math Hero - Perkalian SD</h2>
<div id="setup">
<div class="row g-2">
<div class="col-md-4"><input id="name" class="form-control" placeholder="Nama"></div>
<div class="col-md-4"><select id="mul" class="form-select"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
<div class="col-md-4"><select id="max" class="form-select"><option value=10>Mudah</option><option value=20>Sedang</option><option value=50>Sulit</option><option value=100>Master</option></select></div></div>
<button class="btn btn-primary mt-3 w-100" onclick="start()">Mulai</button>
<div class="mt-3"><b>Rekor:</b> <span id="best"></span></div></div>
<div id="game">
<div class="d-flex justify-content-between"><div>❤️ <span id=h></span></div><div>⭐ <span id=sc>0</span></div><div>🔥 <span id=co>0</span></div><div>⏱ <span id=t>0</span>s</div></div>
<div class="progress my-2"><div id=p class="progress-bar"></div></div>
<div class="text-center big my-3" id=q></div>
<input id=a class="form-control form-control-lg text-center">
<button class="btn btn-success w-100 mt-2" onclick="ans()">Jawab</button>
<div id=m class="mt-2 text-center"></div>
</div></div></div>
<script>
let mul,maxv,h=3,s=0,c=0,n=0,answ,time=0,intv;
best.textContent=localStorage.best||0;
function start(){mul=+mulEl().value;maxv=+maxEl().value;setup.style.display='none';game.style.display='block';upd();next();intv=setInterval(()=>{t.textContent=++time},1000)}
function mulEl(){return document.getElementById('mul')} function maxEl(){return document.getElementById('max')}
function upd(){hEl=document.getElementById('h');hEl.textContent='❤️'.repeat(h);sc.textContent=s;co.textContent=c;p.style.width=(n/20*100)+'%'}
function next(){if(n>=20||h<=0)return end();let b=Math.floor(Math.random()*maxv)+1;answ=mul*b;q.textContent=mul+' × '+b+' = ?';a.value='';a.focus()}
function beep(f){let ac=new(window.AudioContext||webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.15);o.stop(ac.currentTime+.15)}
function ans(){let v=+a.value;n++;if(v===answ){s+=10;c++;m.className='ok text-center';m.textContent='Benar!';beep(700)}else{h--;c=0;m.className='bad text-center';m.textContent='Salah! Jawaban '+answ;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),300);beep(200)}upd();setTimeout(next,500)}
function end(){clearInterval(intv);let grade=s>=180?'A':s>=150?'B':s>=120?'C':'D';if(s>(+localStorage.best||0))localStorage.best=s;document.querySelector('.card').innerHTML='<h2>🎉 Selesai</h2><p>Skor: '+s+'</p><p>Predikat: '+grade+'</p><p>Waktu: '+time+' detik</p><p>Rekor: '+localStorage.best+'</p><button class="btn btn-primary" onclick="location.reload()">Main Lagi</button>'}
a.addEventListener('keydown',e=>{if(e.key==='Enter')ans()});
</script></body></html>
